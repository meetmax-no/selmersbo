# Sveltia CMS – configuration
# Docs: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: meetmax-no/selmersbo
  branch: main
  # IMPORTANT: base_url must be the exact domain where this site (and the
  # /api/oauth endpoints) is served. Change it if your Vercel domain differs.
  base_url: https://selmersbo.vercel.app
  auth_endpoint: api/oauth/authorize

# One predictable upload folder for all media (images + PDFs).
media_folder: "public/uploads"
public_folder: "/uploads"

# Danish editor UI + content.
locale: da
site_url: https://selmersbo.dk
display_url: https://selmersbo.dk

collections:
  - name: udflugter
    label: "Udflugter"
    label_singular: "Udflugt"
    description: "Ture og udflugter der vises på siden Udflugter."
    folder: "src/content/udflugter"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "Kun udsolgte", field: soldOut, pattern: true }
      - { label: "Kladder", field: draft, pattern: true }
    fields:
      - { name: title, label: "Titel", widget: string, hint: "F.eks. Jægerspris Slot" }
      - { name: date, label: "Dato", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: departure, label: "Afgang", widget: string, required: false, hint: "F.eks. 10.00 fra Selmersbo" }
      - { name: returnTime, label: "Hjemkomst", widget: string, required: false, hint: "F.eks. ca. 15.00" }
      - { name: price, label: "Pris", widget: string, required: false, hint: "F.eks. 250 kr." }
      - { name: summary, label: "Kort beskrivelse", widget: text, hint: "Vises på kortet." }
      - { name: image, label: "Billede", widget: image, required: false, hint: "Valgfrit foto fra turen." }
      - { name: body, label: "Fuld beskrivelse", widget: markdown, required: false, hint: "Vises når man klikker på turen." }
      - { name: signupUrl, label: "Tilmeldingslink", widget: string, required: false, hint: "Kun hvis der er online tilmelding – ellers vises 'tilmelding på kontoret'." }
      - { name: soldOut, label: "Udsolgt", widget: boolean, default: false }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: nyheder
    label: "Nyheder"
    label_singular: "Nyhed"
    description: "Nyheder der vises på forsiden og på siden Nyheder."
    folder: "src/content/nyheder"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{title}}"
    sortable_fields: [order, date, title]
    fields:
      - { name: title, label: "Overskrift", widget: string }
      - { name: tag, label: "Mærkat", widget: string, default: "Nyt", hint: "F.eks. Besked, Foredrag, Seniorsiden." }
      - { name: date, label: "Dato", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: pinned, label: "Fast besked (vises øverst, altid åben)", widget: boolean, default: false }
      - { name: order, label: "Rækkefølge", widget: number, default: 0, value_type: int, hint: "Lavere tal vises først på Nyheder-siden." }
      - { name: image, label: "Billede", widget: image, required: false, hint: "Valgfrit foto. Vises ved siden af teksten." }
      - { name: summary, label: "Kort tekst", widget: text, required: false, hint: "Vises på forsiden og som indledning." }
      - { name: body, label: "Uddybende tekst", widget: markdown, required: false, hint: "Vises i fuld længde på siden (til faste beskeder og længere nyheder)." }
      - { name: url, label: "Eksternt link", widget: string, required: false, hint: "Kun hvis nyheden peger ud af siden (f.eks. en artikel)." }
      - { name: cta, label: "Linktekst", widget: string, default: "Læs mere", hint: "Teksten på det eksterne link." }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: aktiviteter
    label: "Aktiviteter"
    label_singular: "Aktivitet"
    description: "Faste aktiviteter der vises på forsiden og på siden Aktiviteter."
    folder: "src/content/aktiviteter"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{fields.order}}-{{title}}"
    summary: "{{title}} ({{day}})"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "Titel", widget: string, hint: "F.eks. Kor & sang" }
      - name: icon
        label: "Ikon"
        widget: select
        default: users
        options:
          - { label: "Sang & musik", value: music }
          - { label: "Bevægelse / gymnastik", value: dumbbell }
          - { label: "Hjerte / omsorg", value: heart }
          - { label: "Spil / kort", value: cards }
          - { label: "IT & teknik", value: device }
          - { label: "Foredrag", value: mic }
          - { label: "Håndarbejde", value: thread }
          - { label: "Kreativt / maling", value: brush }
          - { label: "Bøger / læsning", value: book }
          - { label: "Film", value: film }
          - { label: "Mad & kaffe", value: coffee }
          - { label: "Samtale / snak", value: chat }
          - { label: "Udflugt", value: bus }
          - { label: "Yoga / afspænding", value: yoga }
          - { label: "Gymnastik / træning", value: activity }
          - { label: "Sygepleje / sundhed", value: health }
          - { label: "Fællesskab", value: users }
          - { label: "Kalender", value: calendar }
      - { name: image, label: "Billede", widget: image, required: false, hint: "Valgfrit foto. Uden billede vises ikonet." }
      - { name: day, label: "Tid / dag", widget: string, hint: "F.eks. Hver onsdag kl. 13.00." }
      - { name: text, label: "Kort tekst", widget: text, hint: "Vises på kortet." }
      - { name: status, label: "Status", widget: string, required: false, hint: 'F.eks. "Ingen ledige pladser". Lad stå tom hvis åben.' }
      - { name: body, label: "Fuld beskrivelse", widget: markdown, hint: "Vises når man klikker på aktiviteten." }
      - { name: forside, label: "Vis på forsiden", widget: boolean, default: false, hint: "Sæt kryds for at vise aktiviteten på forsiden. Der vises højst 6 (efter rækkefølge)." }
      - { name: order, label: "Rækkefølge", widget: number, default: 0, value_type: int, hint: "Lavere tal vises først (både på forsiden og på Aktiviteter)." }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: nyhedsbreve
    label: "Nyhedsbreve"
    label_singular: "Nyhedsbrev"
    description: "Nyhedsbreve der vises på siden Nyhedsbreve."
    folder: "src/content/nyhedsbreve"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{year}}-{{month}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titel", widget: string, hint: "F.eks. Nyhedsbrev – august 2026" }
      - { name: date, label: "Dato", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: summary, label: "Kort resumé", widget: text, required: false, hint: "Vises på oversigten." }
      - { name: body, label: "Indhold", widget: markdown, hint: "Selve nyhedsbrevet – skrives som læsbar tekst (ingen PDF)." }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: generalforsamling
    label: "Generalforsamling"
    label_singular: "Dokument"
    description: "Indkaldelser, beretninger og referater. Én post pr. dokument."
    folder: "src/content/generalforsamling"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{fields.order}}-{{title}}"
    summary: "{{title}}"
    sortable_fields: [order, date, title]
    fields:
      - { name: title, label: "Titel", widget: string, hint: "F.eks. Indkaldelse til generalforsamling 2026." }
      - { name: date, label: "Dato", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false }
      - { name: summary, label: "Kort resumé", widget: text, required: false }
      - { name: body, label: "Indhold", widget: markdown, hint: "Selve dokumentet." }
      - { name: order, label: "Rækkefølge", widget: number, default: 0, value_type: int, hint: "Lavere tal vises først." }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: oppdateringer
    label: "Opdateringer (ændringslog)"
    label_singular: "Opdatering"
    description: "Korte, daterede noter om ændringer på siden. Vises på /oppdatering."
    folder: "src/content/oppdateringer"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: date, label: "Dato", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, default: "" }
      - { name: version, label: "Version", widget: string, required: false, hint: 'Valgfri, f.eks. "1.1".' }
      - { name: title, label: "Overskrift", widget: string, hint: "Kort titel på opdateringen." }
      - { name: body, label: "Hvad er ændret", widget: markdown, hint: "Skriv gerne som en punktliste." }
      - { name: draft, label: "Kladde (skjul)", widget: boolean, default: false }

  - name: quiz
    label: "Quiz"
    label_singular: "Quiz"
    description: "Referater og vindere fra husets quizzer. Én post pr. quiz."
    folder: "src/content/quiz"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{year}}-{{month}}-{{day}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titel", widget: string, hint: "F.eks. Quiz 23. februar 2026." }
      - { name: date, label: "Dato", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: image, label: "Vinderbillede", widget: image, required: false }
      - { name: winners, label: "Vinderhold", widget: string, required: false, hint: "Navnene på vinderholdet." }
      - { name: body, label: "Referat", widget: markdown, required: false, hint: "Kort referat fra quizzen." }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: galleri
    label: "Galleri"
    label_singular: "Billede"
    description: "Billeder der vises i galleriet."
    folder: "src/content/galleri"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: caption
    slug: "{{fields.order}}-{{caption}}"
    summary: "{{caption}}"
    sortable_fields: [order, caption]
    fields:
      - { name: image, label: "Billede", widget: image }
      - { name: caption, label: "Billedtekst", widget: string, required: false }
      - { name: order, label: "Rækkefølge", widget: number, default: 0, value_type: int, hint: "Lavere tal vises først." }
      - { name: draft, label: "Kladde (skjul på siden)", widget: boolean, default: false }

  - name: dokumenter
    label: "Dokumenter"
    label_singular: "Dokument"
    description: "Vedtægter, privatlivspolitik og lignende – lange tekster, linket fra bunden."
    folder: "src/content/dokumenter"
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: "Titel", widget: string, hint: "F.eks. Vedtægter for Aktivhuset Selmersbo." }
      - { name: updated, label: "Senest opdateret", widget: string, required: false, hint: 'F.eks. "Oktober 2011".' }
      - { name: summary, label: "Kort resumé", widget: text, required: false, hint: "Vises som beskrivelse (SEO)." }
      - { name: body, label: "Indhold", widget: markdown, hint: "Selve dokumentet." }

  # Indstillinger – kontakt og åbningstider (ét sted, vises overalt)
  - name: indstillinger
    label: "Indstillinger"
    description: "Kontakt og åbningstider. Rettes ét sted – opdateres i top, bund, forside osv."
    files:
      - name: kontakt
        label: "Kontakt & åbningstider"
        file: "src/content/indstillinger/index.md"
        description: "Adresse, telefon, e-mail og åbningstider."
        fields:
          - name: theme
            label: "Farvetema (årstid)"
            widget: select
            default: efteraar
            hint: "Skifter hele sidens farver. Efterår er den varme standard."
            options:
              - { label: "🍂 Efterår (varm – standard)", value: efteraar }
              - { label: "❄️ Vinter (kølig blå-grøn)", value: vinter }
              - { label: "🌸 Forår (frisk grøn og rosa)", value: foraar }
              - { label: "☀️ Sommer (solrig grøn og koral)", value: sommer }
          - { name: name, label: "Kort navn", widget: string, default: "Selmersbo" }
          - { name: full, label: "Fulde navn", widget: string, default: "Aktivhuset Selmersbo" }
          - { name: tagline, label: "Undertekst", widget: string, default: "Aktivhuset i Hørsholm", hint: "Vises under navnet i top og bund." }
          - { name: manager, label: "Daglig leder", widget: string, required: false }
          - name: address
            label: "Adresse"
            widget: object
            fields:
              - { name: street, label: "Gade og nr.", widget: string }
              - { name: zip, label: "Postnr.", widget: string }
              - { name: city, label: "By", widget: string }
              - { name: mapsUrl, label: "Google Maps-link", widget: string, required: false, hint: "Link til kort. Kan stå tomt." }
          - { name: phone, label: "Telefon", widget: string, hint: "F.eks. 4849 4300." }
          - { name: clinicPhone, label: "Sygeplejeklinik (telefon)", widget: string, required: false }
          - { name: email, label: "E-mail", widget: string }
          - { name: facebook, label: "Facebook-link", widget: string, required: false, hint: "Fuld adresse til Facebook-siden. Kan stå tomt." }
          - { name: mobilepay, label: "MobilePay-nummer", widget: string, required: false, hint: "F.eks. 95956. Vises på MobilePay-siden." }
          - name: hours
            label: "Åbningstider"
            widget: list
            label_singular: "Dag"
            summary: "{{fields.day}} – {{fields.time}}"
            fields:
              - { name: day, label: "Dag", widget: string, hint: "F.eks. Mandag." }
              - { name: time, label: "Tid", widget: string, hint: 'F.eks. 09.30 – 16.00 eller "Lukket".' }
              - { name: closed, label: "Lukket denne dag", widget: boolean, default: false, hint: "Sæt til hvis huset er lukket." }
          - name: footerLinks
            label: "Genveje (i bunden)"
            label_singular: "Genvej"
            widget: list
            summary: "{{fields.label}}"
            hint: "Linkene i 'Genveje' nederst på siden. Ræk­ke­følgen bestemmer visningen."
            fields:
              - { name: label, label: "Tekst", widget: string, hint: "F.eks. Om os." }
              - { name: url, label: "Link", widget: string, hint: "Intern side (f.eks. /om-os) eller fuld adresse (https://…)." }

  # Enkeltsider (redigeres, men oprettes/slettes ikke)
  - name: sider
    label: "Sider"
    files:
      - name: forside
        label: "Forside"
        file: "src/content/forside/index.md"
        description: "Overskrift, velkomsttekst og billeder på forsiden."
        fields:
          - { name: heroEyebrow, label: "Forsidens lille overskrift", widget: string }
          - { name: heroTitle, label: "Forsidens store overskrift", widget: string }
          - { name: heroLead, label: "Forsidens indledning", widget: text }
          - { name: heroImage, label: "Forsidens billede", widget: image }
          - { name: heroImageAlt, label: "Billedtekst (til skærmlæser)", widget: string, required: false }
          - { name: heroBadge, label: "Mærkat på billedet", widget: string, required: false }
          - { name: highlightsHeading, label: "Aktuelle links – overskrift", widget: string, required: false, default: "Aktuelt at læse" }
          - name: highlights
            label: "Aktuelle links (vises øverst på forsiden)"
            label_singular: "Link"
            widget: list
            required: false
            summary: "{{fields.label}}"
            hint: "Fx seniorsiden, en avisartikel eller en ekstern side. Åbnes i ny fane."
            fields:
              - { name: label, label: "Tekst på knappen", widget: string }
              - { name: note, label: "Lille undertekst", widget: string, required: false }
              - { name: file, label: "PDF-dokument (anbefales)", widget: file, required: false, hint: "Upload en PDF her, så åbnes den på vores egen side – og tilbage-knappen virker. Bruges i stedet for et link." }
              - { name: url, label: "…eller link til en ekstern side", widget: string, required: false, hint: "Kun hvis du IKKE uploadede en PDF ovenfor. Indsæt hele adressen, fx https://oplev.horsholm.dk" }
              - name: icon
                label: "Ikon"
                widget: select
                default: document
                options:
                  - { label: "Dokument / PDF", value: document }
                  - { label: "Avis", value: newspaper }
                  - { label: "Kalender / program", value: calendar }
                  - { label: "Ekstern side", value: external }
                  - { label: "Billede", value: image }
                  - { label: "Info", value: chat }
          - { name: welcomeEyebrow, label: "Velkomst – lille overskrift", widget: string }
          - { name: welcomeTitle, label: "Velkomst – overskrift", widget: string }
          - { name: welcomeText, label: "Velkomst – tekst", widget: text, hint: "Adskil afsnit med en tom linje." }
          - name: welcomePoints
            label: "Velkomst – punkter"
            label_singular: "Punkt"
            widget: list
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: "Tekst", widget: string }
          - { name: welcomeImage, label: "Velkomst – billede", widget: image }
          - { name: welcomeImageAlt, label: "Billedtekst (til skærmlæser)", widget: string, required: false }
          - { name: welcomeCaption, label: "Billedtekst under foto", widget: string, required: false }

      - name: omos
        label: "Om os"
        file: "src/content/omos/index.md"
        description: "Formål, daglig ledelse, bestyrelse og de frivillige."
        fields:
          - { name: title, label: "Sidetitel", widget: string, default: "Aktivhuset Selmersbo" }
          - { name: lead, label: "Indledning", widget: text, hint: "Kort tekst under overskriften." }
          - { name: purpose, label: "Om huset (formål)", widget: text }
          - name: leader
            label: "Daglig ledelse"
            widget: object
            fields:
              - { name: name, label: "Navn", widget: string }
              - { name: role, label: "Titel", widget: string, default: "Daglig leder" }
              - { name: image, label: "Foto", widget: image, required: false, hint: "Lille portrætfoto." }
              - { name: email, label: "E-mail", widget: string, required: false }
              - { name: phone, label: "Telefon", widget: string, required: false }
              - { name: mobile, label: "Mobil", widget: string, required: false }
          - name: board
            label: "Bestyrelsen"
            label_singular: "Medlem"
            widget: list
            summary: "{{fields.name}} – {{fields.role}}"
            fields:
              - { name: name, label: "Navn", widget: string }
              - { name: role, label: "Rolle", widget: string, hint: "F.eks. Formand, Bestyrelsesmedlem, Suppleant." }
              - { name: image, label: "Foto", widget: image, required: false, hint: "Lille portrætfoto." }
              - { name: phone, label: "Telefon", widget: string, required: false }
              - { name: mobile, label: "Mobil", widget: string, required: false }
          - { name: volunteersHeading, label: "Overskrift – frivillige", widget: string, default: "De frivillige" }
          - { name: volunteersText, label: "Tekst – frivillige", widget: text, hint: "Adskil afsnit med en tom linje." }
          - { name: followHeading, label: "Overskrift – følg os", widget: string, default: "Følg os" }
          - { name: followText, label: "Tekst – følg os", widget: text }
          - { name: facebookUrl, label: "Facebook-gruppe (link)", widget: string, required: false }
          - { name: cvr, label: "CVR-nummer", widget: string, required: false }

      - name: udlejning
        label: "Udlejning"
        file: "src/content/udlejning/index.md"
        description: "Tekst og priser på siden Udlejning."
        fields:
          - { name: title, label: "Sidetitel", widget: string, default: "Udlejning" }
          - { name: lead, label: "Indledning", widget: text }
          - name: conditions
            label: "Vilkår"
            widget: list
            label_singular: "Vilkår"
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: "Tekst", widget: text }
          - { name: contactNote, label: "Kontaktlinje", widget: string, required: false, hint: "F.eks. Henvendelse til kontoret på tlf.: 4849 4300." }
          - { name: priceHeading, label: "Pris-indledning", widget: string, required: false }
          - name: prices
            label: "Priser – enkeltleje"
            widget: list
            summary: "{{fields.label}} – {{fields.price}}"
            fields:
              - { name: label, label: "Lokale", widget: string }
              - { name: price, label: "Pris", widget: string }
          - { name: recurringHeading, label: "Overskrift – fast leje", widget: string, required: false }
          - name: recurringPrices
            label: "Priser – fast leje"
            widget: list
            summary: "{{fields.label}} – {{fields.price}}"
            fields:
              - { name: label, label: "Lokale", widget: string }
              - { name: price, label: "Pris", widget: string }
          - { name: extraHeading, label: "Overskrift – udstyr", widget: string, required: false }
          - name: extraPrices
            label: "Priser – udstyr"
            widget: list
            summary: "{{fields.label}} – {{fields.price}}"
            fields:
              - { name: label, label: "Beskrivelse", widget: string }
              - { name: price, label: "Pris", widget: string }
